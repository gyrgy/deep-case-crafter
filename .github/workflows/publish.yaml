name: Publish Package

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install Dependencies
        # `npm install` (not `npm ci`) tolerates lockfiles that a single-platform
        # `npm install` has pruned of other platforms' optional deps (npm/cli#4828).
        run: npm install --no-audit --no-fund

      - name: Check Tag Matches Package Version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Run All Checks
        # Lint, formatting, types, tests with coverage, build and the published types
        run: npm run check

      - name: Check Published Types with TypeScript 4.7
        # The oldest TypeScript version the published declarations support
        run: |
          npx --yes --package typescript@4.7.4 -- tsc -p dist-type-tests
          npx --yes --package typescript@4.7.4 -- tsc -p dist-type-tests/tsconfig.declarations.json
          node dist-type-tests/checkDeclarations.mjs
          npx --yes --package typescript@4.7.4 -- tsc -p dist-type-tests/tsconfig.consumer.json
          npx --yes --package typescript@4.7.4 -- tsc -p dist-type-tests/tsconfig.loose.json
          npx --yes --package typescript@4.7.4 -- tsc -p dist-type-tests/tsconfig.exact.json

      - name: Check Published Types with TypeScript 7
        # The native compiler, newer than the TypeScript 6 the project builds with
        run: |
          npx --yes --package typescript@7 -- tsc -p dist-type-tests
          npx --yes --package typescript@7 -- tsc -p dist-type-tests/tsconfig.declarations.json
          node dist-type-tests/checkDeclarations.mjs
          npx --yes --package typescript@7 -- tsc -p dist-type-tests/tsconfig.consumer.json
          npx --yes --package typescript@7 -- tsc -p dist-type-tests/tsconfig.loose.json
          npx --yes --package typescript@7 -- tsc -p dist-type-tests/tsconfig.exact.json

      - name: Publish to npm
        # --provenance links the published package to this workflow run and commit
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
