name: Quality Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Base Branch
        run: git fetch --no-tags --depth=50 origin ${{ github.event.pull_request.base.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        # `npm install` (not `npm ci`) tolerates lockfiles that a single-platform
        # `npm install` has pruned of other platforms' optional deps (npm/cli#4828).
        run: npm install --no-audit --no-fund

      - name: Perform Lint Check
        run: npm run lint

      - name: Check TypeScript Types
        run: npm run tsc

      - name: Execute Tests with Coverage
        run: npm run test-coverage

      - name: Upload Test Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: Display Test Coverage Summary
        run: npx jest --coverage --coverageReporters=text-summary
