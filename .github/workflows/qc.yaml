name: Quality Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        # `npm install` (not `npm ci`) tolerates lockfiles that a single-platform
        # `npm install` has pruned of other platforms' optional deps (npm/cli#4828).
        run: npm install --no-audit --no-fund

      - name: Perform Lint Check
        run: npm run lint

      - name: Check Formatting
        run: npm run format:check

      - name: Check TypeScript Types
        run: npm run tsc

      - name: Execute Tests with Coverage
        run: npm run test-coverage

      - name: Upload Test Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage

      - name: Build Package
        run: npm run build

      - name: Check Fast Result Objects
        run: npm run test:dist-objects

      - name: Check Published Types
        run: npm run test:dist-types

      - name: Check Published Types with TypeScript 4.7
        # The oldest TypeScript version the published declarations support
        run: |
          npx --yes --package typescript@4.7.4 -- tsc -p dist-type-tests
          npx --yes --package typescript@4.7.4 -- tsc -p dist-type-tests/tsconfig.declarations.json
          node dist-type-tests/checkDeclarations.mjs
          npx --yes --package typescript@4.7.4 -- tsc -p dist-type-tests/tsconfig.consumer.json
          npx --yes --package typescript@4.7.4 -- tsc -p dist-type-tests/tsconfig.loose.json
          npx --yes --package typescript@4.7.4 -- tsc -p dist-type-tests/tsconfig.exact.json

      - name: Check Published Types with TypeScript 7
        # The native compiler, newer than the TypeScript 6 the project builds with
        run: |
          npx --yes --package typescript@7 -- tsc -p dist-type-tests
          npx --yes --package typescript@7 -- tsc -p dist-type-tests/tsconfig.declarations.json
          node dist-type-tests/checkDeclarations.mjs
          npx --yes --package typescript@7 -- tsc -p dist-type-tests/tsconfig.consumer.json
          npx --yes --package typescript@7 -- tsc -p dist-type-tests/tsconfig.loose.json
          npx --yes --package typescript@7 -- tsc -p dist-type-tests/tsconfig.exact.json

  dist-newer-node:
    # Only Node 24 and later compiled the loop that reads objects again and again: the
    # check of that (dist-tests/deoptLoop.cjs) can fail only there
    name: Dist Checks on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24', '26']
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Package
        run: npm run build

      - name: Check Fast Result Objects
        run: npm run test:dist-objects
